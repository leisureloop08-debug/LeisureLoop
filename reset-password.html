<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | LeisureLoop</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5F8FC;font-family:Arial,sans-serif;color:#101D3A}.card{width:min(92%,430px);padding:32px;background:#fff;border-radius:18px;box-shadow:0 12px 40px #101D3A14}h1{text-align:center;margin-top:0}p{line-height:1.6;color:#65758B}label{display:block;margin:16px 0 7px;font-weight:700}input{width:100%;padding:13px;border:1px solid #cbd8d1;border-radius:9px;font-size:16px}button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:9px;background:#087E8B;color:#fff;font-weight:700;font-size:16px;cursor:pointer}button:disabled{opacity:.6}#status{min-height:24px}a{color:#087E8B;font-weight:700}
</style><link rel="icon" type="image/svg+xml" href="/assets/leisureloop-logo.svg">
</head>
<body><main class="card"><h1><img src="/assets/leisureloop-logo.svg" alt="" style="width:44px;height:44px;vertical-align:middle"> <span style="background:linear-gradient(90deg,#101D3A,#087E8B,#18C94F);-webkit-background-clip:text;background-clip:text;color:transparent">LeisureLoop</span></h1><h2>Choose a new password</h2><p>Use at least 8 characters. Your reset link can only be used once.</p>
<form id="resetForm"><label for="password">New password</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><button id="submit" type="submit">Update password</button></form>
<p id="status" role="status"></p><a href="/login.html">Return to login</a></main>
<script>
const form=document.getElementById("resetForm"),status=document.getElementById("status"),button=document.getElementById("submit"),token=new URLSearchParams(location.search).get("token");
form.addEventListener("submit",async event=>{
 event.preventDefault();
 const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;
 if(!token){status.textContent="This reset link is missing or invalid.";return;}
 if(password!==confirm){status.textContent="The passwords do not match.";return;}
 button.disabled=true;button.textContent="Updating…";
 try{
  const response=await fetch("/api/auth-reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password})});
  const data=await response.json();status.textContent=data.message||data.error||"Unable to update password.";
  if(response.ok){form.reset();button.textContent="Password updated";}
  else{button.disabled=false;button.textContent="Update password";}
 }catch(e){status.textContent="Connection error. Please try again.";button.disabled=false;button.textContent="Update password";}
});
</script></body></html>
