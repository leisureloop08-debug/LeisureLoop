<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Email | LeisureLoop</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5F8FC;font-family:Arial,sans-serif;color:#101D3A}.card{width:min(92%,430px);padding:32px;background:#fff;border-radius:18px;box-shadow:0 12px 40px #101D3A14;text-align:center}h1{margin-top:0}p{line-height:1.6;color:#65758B}a{color:#087E8B;font-weight:700}#status{margin:20px 0}
</style><link rel="icon" type="image/svg+xml" href="/assets/leisureloop-logo.svg">
</head>
<body><main class="card"><h1><img src="/assets/leisureloop-logo.svg" alt="" style="width:44px;height:44px;vertical-align:middle"> <span style="background:linear-gradient(90deg,#101D3A,#087E8B,#18C94F);-webkit-background-clip:text;background-clip:text;color:transparent">LeisureLoop</span></h1><h2>Email verification</h2><p id="status">Checking your verification link…</p><a href="/login.html">Go to login</a></main>
<script>
(async()=>{
 const status=document.getElementById("status");
 const token=new URLSearchParams(location.search).get("token");
 if(!token){status.textContent="This verification link is missing its token.";return;}
 try{
  const response=await fetch("/api/auth-verify-email",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token})});
  const data=await response.json();
  status.textContent=data.message||data.error||"Unable to verify this link.";
 }catch(e){status.textContent="Connection error. Please try again later.";}
})();
</script></body></html>
